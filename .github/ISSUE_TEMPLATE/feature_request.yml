name: 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请尽量说明真实使用场景，这有助于判断功能优先级和设计方式。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景或问题
      description: 你现在遇到什么不方便，或者希望解决什么工作流问题？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望 EMTools 如何支持这个场景？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方案
      description: 目前你是用什么工具或流程解决的？

  - type: dropdown
    id: contribution
    attributes:
      label: 是否愿意参与
      options:
        - 愿意提交 PR
        - 愿意协助测试
        - 暂时只提出建议
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可以添加截图、示例输入输出或相关资料链接。

